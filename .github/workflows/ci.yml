name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install optional test deps (if present)
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema argon2-cffi || true

      - name: Run tests
        run: python -m pytest tests/ -q --tb=no

      - name: Run skill checks
        run: |
          python3 scripts/sigil_forge.py check
          python3 scripts/sigil_forge.py doctor
          python3 scripts/validate_hermes_skill.py

      - name: Quick end-to-end smoke (no passphrase)
        run: |
          mkdir -p /tmp/ci-smoke
          python3 scripts/sigil_forge.py construct --intent "CI smoke test focus" --mode creative --out /tmp/ci-smoke
          python3 scripts/sigil_forge.py verify /tmp/ci-smoke/*/glyph.svg
          python3 scripts/sigil_forge.py doctor

  lint-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Policy and framing checks
        run: |
          python3 scripts/policy_lint.py --help || true
          python3 scripts/sigil_forge.py policy check --text "I maintain calm focus" || echo "policy check ran"
